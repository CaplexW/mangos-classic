name: Build mangosd (guildless playerbots patch)

on:
  push:
    branches: [ guildless ]
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  BUILD_OPTIONS: "-DBUILD_EXTRACTORS=OFF -DBUILD_PLAYERBOTS=ON -DBUILD_AHBOT=ON -DBUILD_GIT_ID=ON -DBUILD_MODULES=ON -DBUILD_MODULE_ACHIEVEMENTS=ON -DBUILD_MODULE_DUALSPEC=ON -DBUILD_MODULE_HARDCORE=ON -DBUILD_MODULE_IMMERSIVE=ON -DBUILD_MODULE_TRANSMOG=ON -DBUILD_MODULE_BOOST=ON -DBUILD_MODULE_BARBER=ON -DBUILD_MODULE_TRAININGDUMMIES=ON"
  REPO_DIR: ${{ github.workspace }}
  BUILD_DIR: ${{ github.workspace }}/bin/builddir

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout CMaNGOS Classic
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      - name: Create Build Environment
        run: cmake -E make_directory ${{ env.BUILD_DIR }}

      - name: Install Boost
        uses: MarkusJx/install-boost@v2.5.1
        id: install-boost
        with:
          boost_version: 1.86.0
          platform_version: "2022"
          toolset: msvc

      - name: Configure
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: cmake ${{ env.BUILD_OPTIONS }} -B ${{ env.BUILD_DIR }} -S ${{ env.REPO_DIR }}

      - name: Patch transmog module (any class, any armor type)
        run: python "${{ env.REPO_DIR }}/tools/patch_transmog_any_armor.py" "${{ env.REPO_DIR }}/src/modules/transmog"

      - name: Build
        env:
          MAKEFLAGS: "-j8"
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Show output
        run: dir ${{ env.BUILD_DIR }}\bin\x64_${{ env.BUILD_TYPE }}

      - name: Upload mangosd.exe
        uses: actions/upload-artifact@v4
        with:
          name: mangosd-exe
          path: ${{ env.BUILD_DIR }}/bin/x64_${{ env.BUILD_TYPE }}/mangosd.exe
          if-no-files-found: error
